#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M
#Gradle
# Proxy must live on the daemon JVM (org.gradle.jvmargs). systemProp alone only
# reaches the client; wasm artifact fetches run inside the daemon.
org.gradle.jvmargs=-Xmx3072M -Dfile.encoding=UTF-8 -Dhttp.proxyHost=192.168.4.1 -Dhttp.proxyPort=7890 -Dhttps.proxyHost=192.168.4.1 -Dhttps.proxyPort=7890 -Dhttp.nonProxyHosts=localhost|127.*|[::1]
systemProp.http.proxyHost=192.168.4.1
systemProp.http.proxyPort=7890
systemProp.https.proxyHost=192.168.4.1
systemProp.https.proxyPort=7890
systemProp.http.nonProxyHosts=localhost|127.*|[::1]
org.gradle.configuration-cache=true
org.gradle.caching=true