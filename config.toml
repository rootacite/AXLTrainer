[environment]
pretrained_model_name_or_path = "/opt/models/checkpoints/illustriousXLV20_v20Stable.safetensors"

output_dir = "/home/acite/LLM/axltrainer/outputs"
logging_dir = "/home/acite/LLM/axltrainer/logs"

# Alternatives:
train_data_dir = "/home/acite/LLM/Character/Kanae/st"
output_name = "Kanae"
# Datasets trained together: one `[[environment.train_data]]` block per folder, `repeat` = how often
# that folder's images are drawn inside a single epoch (1..512; 3 against 1 trains it three times as
# often per epoch). With no block at all the list is empty and the `train_data_dir` line above is
# trained once per epoch, which is what this file does right now. Ranko Utils → Environment edits both
# and always writes `train_data_dir` as the first block's path; the trainer drops the scalar as soon as
# a block exists. The epoch length, the step count and the LR schedule follow the sum, so raising a
# repeat lengthens the run. It is not a loss-weighting knob: it changes how often a folder is drawn,
# not what one image contributes. A small folder with a large repeat can fill a batch with near-copies
# of the same few images.
# [[environment.train_data]]
# path = "/home/acite/LLM/Character/LLLJ/"
# repeat = 3
#
# [[environment.train_data]]
# path = "/home/acite/Pictures/05_babara"
# repeat = 1
# none | tail | vmm — Ranko Utils → ROCm. Takes effect on the next Train start.
amdfq = "vmm"
# GiB of driver-reported free VRAM (amdgpu mem_info_vram_*) the VMM hook will not consume. 0 = off.
# The pre-fix workaround for eviction handing a process's frames to another one. NEEDED on the stock
# kernel: the current boot is 7.2.6-zen2-1-zen, which lacks that fix.
# Ranko Utils → ROCm. Takes effect on the next Train start. Ignored unless amdfq = "vmm".
amdfq_vram_reserve_gib = 0.128
# Pre-fix workaround: a freed range keeps its GPU virtual address for the process lifetime. false = the hook
# gives the VA back on free, which needs the fixed kernel (7.2.7-acite++); the stock kernel does not. NEEDED as
# long as this boots the stock kernel. Ranko Utils → ROCm. Ignored unless amdfq = "vmm".
amdfq_va_never_reuse = false
# Allocation pool for the VMM hook, in MiB: 0 = off (every hipMalloc keeps its own hipMemCreate), else
# 16..512. On: one hipMemCreate builds a pool of this size and any request of at most half of it is carved
# out of a pool that already exists, with no driver call; a pool is released once the upper layer has freed
# everything carved out of it. Ranko Utils → ROCm. Takes effect on the next Train start.
# NOT a case of bigger is better: a pool is committed VRAM nothing else can use until its last block is
# freed (OOM / fragmentation), and the small-request traffic it removes is a bounded share of each step, so
# the gain flattens out. Measured on this repo's own workload (test/bench_alloc_pool.py, 201 steps per run,
# pool off vs 16/32/64/128 MiB): step rate is flat to -1% and the cost grows with the size, so 256 MiB
# aborted two runs out of two while the pool-off baseline aborted one in nine. A pool's blocks are also
# neighbours — an over-read past a block still lands in mapped memory, but an over-write past its end can
# reach another live block.
amdfq_pool_mib = 0
